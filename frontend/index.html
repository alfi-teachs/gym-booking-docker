<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gym Class Booking</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { margin-bottom: 4px; }
    .muted { color: #666; margin-top: 0; }
    input { padding: 8px; width: 100%; box-sizing: border-box; margin: 16px 0; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center; }
    button { padding: 8px 14px; border: 0; border-radius: 6px; background: #e4572e; color: #fff; cursor: pointer; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #msg { min-height: 1.2em; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Gym Class Booking</h1>
  <p class="muted">Nginx → Flask API → PostgreSQL, running in Docker Compose</p>

  <input id="name" placeholder="Your name" maxlength="60">
  <p id="msg"></p>
  <div id="classes">Loading…</div>

  <script>
    const list = document.getElementById("classes");
    const msg = document.getElementById("msg");

    async function loadClasses() {
      const res = await fetch("/api/classes");
      const classes = await res.json();
      list.innerHTML = "";
      for (const c of classes) {
        const card = document.createElement("div");
        card.className = "card";

        const info = document.createElement("div");
        const title = document.createElement("strong");
        title.textContent = `${c.name} · ${c.time}`;
        const detail = document.createElement("div");
        detail.className = "muted";
        detail.textContent = `Trainer: ${c.trainer} · ${c.booked}/${c.capacity} booked`;
        info.append(title, detail);

        const btn = document.createElement("button");
        btn.textContent = c.booked >= c.capacity ? "Full" : "Book";
        btn.disabled = c.booked >= c.capacity;
        btn.onclick = () => book(c.id);

        card.append(info, btn);
        list.append(card);
      }
    }

    async function book(classId) {
      const name = document.getElementById("name").value.trim();
      if (!name) { msg.textContent = "Enter your name first."; return; }
      const res = await fetch("/api/bookings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ class_id: classId, member_name: name }),
      });
      const data = await res.json();
      msg.textContent = res.ok ? "Booked!" : `Error: ${data.error}`;
      loadClasses();
    }

    loadClasses().catch(() => { list.textContent = "Could not reach the API."; });
  </script>
</body>
</html>
