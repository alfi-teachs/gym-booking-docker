name: build scan and push
"on":
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: List files BEFORE checkout
        run: ls -la

      - name: Checkout
        uses: actions/checkout@v4

      - name: List files AFTER checkout
        run: ls -la