name: build scan and push
"on":
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-test-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: gym-api

    steps:
  
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files AFTER checkout
        run: ls -la

      - name: Build image
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" -t "$IMAGE_NAME:latest" ./api  

      - name: List images
        run: docker images