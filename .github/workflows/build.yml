name: build scan and push
"on":
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-test-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: gym-api

    steps:
  
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files AFTER checkout
        run: ls -la

      - name: Build image
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" -t "$IMAGE_NAME:latest" ./api  

      - name: List images
        run: docker images

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          
      - name: Integration test (docker compose)
        run: |
          cp .env.example .env
          docker compose up -d --no-build --wait
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/api/classes
          curl -fsS -X POST http://localhost:8080/api/bookings \
            -H "Content-Type: application/json" \
            -d '{"class_id": 1, "member_name": "ci-test"}'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v      